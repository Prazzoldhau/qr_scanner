workflows:
  android-release:
    name: Sajhya - Android
    max_build_duration: 30
    instance_type: linux_x2
    environment:
      flutter: stable
      # Requires a keystore uploaded under
      # Codemagic > Team settings > Code signing identities with the reference
      # name "sajhya_keystore". Rename here if you used a different reference.
      android_signing:
        - sajhya_keystore
      vars:
        PACKAGE_NAME: "com.manurya.sajhya_patient_app"
    scripts:
      - name: Write key.properties
        script: |
          # A missing keystore must fail the build. Previously this fell through to
          # debug signing, producing an artifact that Play rejects at upload with no
          # warning until then.
          if [ -z "$CM_KEYSTORE_PATH" ]; then
            echo "ERROR: no keystore available. Add one in Codemagic > Team settings >"
            echo "Code signing identities and reference it under android_signing above."
            exit 1
          fi
          cat > $CM_BUILD_DIR/android/key.properties <<EOF
          storeFile=$CM_KEYSTORE_PATH
          storePassword=$CM_KEYSTORE_PASSWORD
          keyAlias=$CM_KEY_ALIAS
          keyPassword=$CM_KEY_PASSWORD
          EOF
      - name: Get Flutter packages
        script: flutter pub get
      - name: Generate launcher icons
        script: dart run flutter_launcher_icons
      - name: Build Android APK
        script: flutter build apk --release
      - name: Build Android App Bundle
        script: flutter build appbundle --release
    artifacts:
      - build/app/outputs/flutter-apk/*.apk
      - build/app/outputs/bundle/**/*.aab
    publishing:
      email:
        recipients:
          - aestheticphysiox@gmail.com
        notify:
          success: true
          failure: true
