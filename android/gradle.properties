org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=2G
android.useAndroidX=true
android.enableJetifier=true

# Kotlin's incremental compiler cannot release its cache file handles on Windows
# with this AGP 9 / Kotlin 2.3 / Gradle 9 combination, which fails the release
# build in :mobile_scanner:compileReleaseKotlin with
# "Could not close incremental caches". Disabling incremental compilation is the
# supported workaround; it only costs build time, not correctness.
kotlin.incremental=false
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
